[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhack"
version = "1.0.0"
description = "ZHack - Escáner de seguridad web (masivo y profundo). Solo para webs propias o autorizadas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
zhack = "zhack.cli:main"

[tool.setuptools.packages.find]
include = ["zhack*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
